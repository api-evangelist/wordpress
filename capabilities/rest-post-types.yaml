naftiko: 1.0.0-alpha2
info:
  label: WordPress REST API — Post Types
  description: 'WordPress REST API — Post Types. 1 operations. Lead operation: WordPress List Post Types. Self-contained Naftiko
    capability covering one Wordpress business surface.'
  tags:
  - Wordpress
  - Post Types
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORDPRESS_API_KEY: WORDPRESS_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-post-types
    baseUri: https://{site}/wp-json
    description: WordPress REST API — Post Types business capability. Self-contained, no shared references.
    resources:
    - name: wp-v2-types
      path: /wp/v2/types
      operations:
      - name: listposttypes
        method: GET
        description: WordPress List Post Types
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: wordpress_logged_in
      value: '{{env.WORDPRESS_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: rest-post-types-rest
    port: 8080
    description: REST adapter for WordPress REST API — Post Types. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/wp/v2/types
      name: wp-v2-types
      description: REST surface for wp-v2-types.
      operations:
      - method: GET
        name: listposttypes
        description: WordPress List Post Types
        call: rest-post-types.listposttypes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-post-types-mcp
    port: 9090
    transport: http
    description: MCP adapter for WordPress REST API — Post Types. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: wordpress-list-post-types
      description: WordPress List Post Types
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-post-types.listposttypes
      outputParameters:
      - type: object
        mapping: $.
