naftiko: 1.0.0-alpha2
info:
  label: WordPress REST API — Pages
  description: 'WordPress REST API — Pages. 3 operations. Lead operation: WordPress List Pages. Self-contained Naftiko capability
    covering one Wordpress business surface.'
  tags:
  - Wordpress
  - Pages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORDPRESS_API_KEY: WORDPRESS_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-pages
    baseUri: https://{site}/wp-json
    description: WordPress REST API — Pages business capability. Self-contained, no shared references.
    resources:
    - name: wp-v2-pages
      path: /wp/v2/pages
      operations:
      - name: listpages
        method: GET
        description: WordPress List Pages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Current page of the collection.
        - name: per_page
          in: query
          type: integer
          description: Maximum number of items to be returned.
        - name: status
          in: query
          type: string
          description: Limit result set to pages with a specific status.
        - name: parent
          in: query
          type: integer
          description: Limit result set to pages with a specific parent ID.
      - name: createpage
        method: POST
        description: WordPress Create Page
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: wp-v2-pages-id
      path: /wp/v2/pages/{id}
      operations:
      - name: getpage
        method: GET
        description: WordPress Get Page
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: Unique identifier for the page.
          required: true
    authentication:
      type: apikey
      key: wordpress_logged_in
      value: '{{env.WORDPRESS_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: rest-pages-rest
    port: 8080
    description: REST adapter for WordPress REST API — Pages. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/wp/v2/pages
      name: wp-v2-pages
      description: REST surface for wp-v2-pages.
      operations:
      - method: GET
        name: listpages
        description: WordPress List Pages
        call: rest-pages.listpages
        with:
          page: rest.page
          per_page: rest.per_page
          status: rest.status
          parent: rest.parent
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createpage
        description: WordPress Create Page
        call: rest-pages.createpage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/wp/v2/pages/{id}
      name: wp-v2-pages-id
      description: REST surface for wp-v2-pages-id.
      operations:
      - method: GET
        name: getpage
        description: WordPress Get Page
        call: rest-pages.getpage
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-pages-mcp
    port: 9090
    transport: http
    description: MCP adapter for WordPress REST API — Pages. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: wordpress-list-pages
      description: WordPress List Pages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-pages.listpages
      with:
        page: tools.page
        per_page: tools.per_page
        status: tools.status
        parent: tools.parent
      outputParameters:
      - type: object
        mapping: $.
    - name: wordpress-create-page
      description: WordPress Create Page
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-pages.createpage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: wordpress-get-page
      description: WordPress Get Page
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-pages.getpage
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
