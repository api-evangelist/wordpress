naftiko: 1.0.0-alpha2
info:
  label: WordPress REST API — Themes
  description: 'WordPress REST API — Themes. 1 operations. Lead operation: WordPress List Themes. Self-contained Naftiko capability
    covering one Wordpress business surface.'
  tags:
  - Wordpress
  - Themes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORDPRESS_API_KEY: WORDPRESS_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-themes
    baseUri: https://{site}/wp-json
    description: WordPress REST API — Themes business capability. Self-contained, no shared references.
    resources:
    - name: wp-v2-themes
      path: /wp/v2/themes
      operations:
      - name: listthemes
        method: GET
        description: WordPress List Themes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Limit result set to themes assigned one or more statuses.
    authentication:
      type: apikey
      key: wordpress_logged_in
      value: '{{env.WORDPRESS_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: rest-themes-rest
    port: 8080
    description: REST adapter for WordPress REST API — Themes. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/wp/v2/themes
      name: wp-v2-themes
      description: REST surface for wp-v2-themes.
      operations:
      - method: GET
        name: listthemes
        description: WordPress List Themes
        call: rest-themes.listthemes
        with:
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-themes-mcp
    port: 9090
    transport: http
    description: MCP adapter for WordPress REST API — Themes. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: wordpress-list-themes
      description: WordPress List Themes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-themes.listthemes
      with:
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
