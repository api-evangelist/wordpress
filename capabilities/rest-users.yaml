naftiko: 1.0.0-alpha2
info:
  label: WordPress REST API — Users
  description: 'WordPress REST API — Users. 2 operations. Lead operation: WordPress List Users. Self-contained Naftiko capability
    covering one Wordpress business surface.'
  tags:
  - Wordpress
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORDPRESS_API_KEY: WORDPRESS_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-users
    baseUri: https://{site}/wp-json
    description: WordPress REST API — Users business capability. Self-contained, no shared references.
    resources:
    - name: wp-v2-users
      path: /wp/v2/users
      operations:
      - name: listusers
        method: GET
        description: WordPress List Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Current page of the collection.
        - name: per_page
          in: query
          type: integer
          description: Maximum number of items to be returned.
        - name: roles
          in: query
          type: array
          description: Limit result set to users matching at least one specific role.
    - name: wp-v2-users-id
      path: /wp/v2/users/{id}
      operations:
      - name: getuser
        method: GET
        description: WordPress Get User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: Unique identifier for the user.
          required: true
    authentication:
      type: apikey
      key: wordpress_logged_in
      value: '{{env.WORDPRESS_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: rest-users-rest
    port: 8080
    description: REST adapter for WordPress REST API — Users. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/wp/v2/users
      name: wp-v2-users
      description: REST surface for wp-v2-users.
      operations:
      - method: GET
        name: listusers
        description: WordPress List Users
        call: rest-users.listusers
        with:
          page: rest.page
          per_page: rest.per_page
          roles: rest.roles
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/wp/v2/users/{id}
      name: wp-v2-users-id
      description: REST surface for wp-v2-users-id.
      operations:
      - method: GET
        name: getuser
        description: WordPress Get User
        call: rest-users.getuser
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for WordPress REST API — Users. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: wordpress-list-users
      description: WordPress List Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-users.listusers
      with:
        page: tools.page
        per_page: tools.per_page
        roles: tools.roles
      outputParameters:
      - type: object
        mapping: $.
    - name: wordpress-get-user
      description: WordPress Get User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-users.getuser
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
