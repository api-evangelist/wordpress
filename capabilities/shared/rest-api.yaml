naftiko: "1.0.0-alpha1"

info:
  label: "WordPress REST API"
  description: "Core WordPress REST API providing CRUD operations for posts, pages, media, comments, users, categories, tags, settings, themes, and plugins."
  tags:
    - CMS
    - Content Management
    - WordPress
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      WORDPRESS_APP_PASSWORD: WORDPRESS_APP_PASSWORD
      WORDPRESS_USERNAME: WORDPRESS_USERNAME

capability:
  consumes:
    - type: http
      namespace: wordpress-rest
      baseUri: https://{site}/wp-json
      description: "WordPress REST API for content management"
      authentication:
        type: basic
        username: "{{WORDPRESS_USERNAME}}"
        password: "{{WORDPRESS_APP_PASSWORD}}"
      resources:
        - name: posts
          path: /wp/v2/posts
          description: "WordPress posts management"
          operations:
            - name: list-posts
              method: GET
              description: "Retrieve a list of posts"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: Current page of results
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: Number of results per page
                - name: search
                  in: query
                  type: string
                  required: false
                  description: Search string to filter posts
                - name: status
                  in: query
                  type: string
                  required: false
                  description: Filter by post status
                - name: categories
                  in: query
                  type: array
                  required: false
                  description: Filter by category IDs
                - name: orderby
                  in: query
                  type: string
                  required: false
                  description: Sort order field
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-post
              method: POST
              description: "Create a new post"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  title: "{{tools.title}}"
                  content: "{{tools.content}}"
                  status: "{{tools.status}}"
                  categories: "{{tools.categories}}"

        - name: post-by-id
          path: /wp/v2/posts/{id}
          description: "Single post operations"
          operations:
            - name: get-post
              method: GET
              description: "Retrieve a single post by ID"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: Post ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-post
              method: PUT
              description: "Update an existing post"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: Post ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  title: "{{tools.title}}"
                  content: "{{tools.content}}"
                  status: "{{tools.status}}"
            - name: delete-post
              method: DELETE
              description: "Delete a post"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: Post ID
                - name: force
                  in: query
                  type: boolean
                  required: false
                  description: Whether to permanently delete
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: pages
          path: /wp/v2/pages
          description: "WordPress pages management"
          operations:
            - name: list-pages
              method: GET
              description: "Retrieve a list of pages"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: Current page of results
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: Number of results per page
                - name: status
                  in: query
                  type: string
                  required: false
                  description: Filter by status
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-page
              method: POST
              description: "Create a new page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  title: "{{tools.title}}"
                  content: "{{tools.content}}"
                  status: "{{tools.status}}"

        - name: media
          path: /wp/v2/media
          description: "WordPress media library"
          operations:
            - name: list-media
              method: GET
              description: "Retrieve media items"
              inputParameters:
                - name: media_type
                  in: query
                  type: string
                  required: false
                  description: Filter by media type
                - name: mime_type
                  in: query
                  type: string
                  required: false
                  description: Filter by MIME type
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: media-by-id
          path: /wp/v2/media/{id}
          description: "Single media item operations"
          operations:
            - name: get-media
              method: GET
              description: "Retrieve a single media item"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: Media item ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: comments
          path: /wp/v2/comments
          description: "WordPress comments management"
          operations:
            - name: list-comments
              method: GET
              description: "Retrieve comments"
              inputParameters:
                - name: post
                  in: query
                  type: array
                  required: false
                  description: Filter by post IDs
                - name: status
                  in: query
                  type: string
                  required: false
                  description: Filter by status
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-comment
              method: POST
              description: "Create a new comment"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  post: "{{tools.post_id}}"
                  author_name: "{{tools.author_name}}"
                  author_email: "{{tools.author_email}}"
                  content: "{{tools.content}}"

        - name: users
          path: /wp/v2/users
          description: "WordPress users management"
          operations:
            - name: list-users
              method: GET
              description: "Retrieve users"
              inputParameters:
                - name: roles
                  in: query
                  type: array
                  required: false
                  description: Filter by user roles
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: user-by-id
          path: /wp/v2/users/{id}
          description: "Single user operations"
          operations:
            - name: get-user
              method: GET
              description: "Retrieve a single user"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: User ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: categories
          path: /wp/v2/categories
          description: "WordPress categories management"
          operations:
            - name: list-categories
              method: GET
              description: "Retrieve categories"
              inputParameters:
                - name: search
                  in: query
                  type: string
                  required: false
                  description: Search string
                - name: hide_empty
                  in: query
                  type: boolean
                  required: false
                  description: Hide empty categories
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-category
              method: POST
              description: "Create a new category"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  description: "{{tools.description}}"
                  parent: "{{tools.parent}}"

        - name: tags
          path: /wp/v2/tags
          description: "WordPress tags management"
          operations:
            - name: list-tags
              method: GET
              description: "Retrieve tags"
              inputParameters:
                - name: search
                  in: query
                  type: string
                  required: false
                  description: Search string
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: search
          path: /wp/v2/search
          description: "WordPress content search"
          operations:
            - name: search-content
              method: GET
              description: "Search across WordPress content"
              inputParameters:
                - name: search
                  in: query
                  type: string
                  required: true
                  description: Search query string
                - name: type
                  in: query
                  type: string
                  required: false
                  description: Content type to search
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: settings
          path: /wp/v2/settings
          description: "WordPress site settings"
          operations:
            - name: get-settings
              method: GET
              description: "Retrieve site settings"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: themes
          path: /wp/v2/themes
          description: "WordPress themes management"
          operations:
            - name: list-themes
              method: GET
              description: "Retrieve installed themes"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: plugins
          path: /wp/v2/plugins
          description: "WordPress plugins management"
          operations:
            - name: list-plugins
              method: GET
              description: "Retrieve installed plugins"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: block-types
          path: /wp/v2/block-types
          description: "WordPress registered block types"
          operations:
            - name: list-block-types
              method: GET
              description: "Retrieve registered block types"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: blocks
          path: /wp/v2/blocks
          description: "WordPress reusable blocks"
          operations:
            - name: list-blocks
              method: GET
              description: "Retrieve reusable blocks"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: post-types
          path: /wp/v2/types
          description: "WordPress registered post types"
          operations:
            - name: list-post-types
              method: GET
              description: "Retrieve registered post types"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: wordpress-rest-api
      resources:
        - path: /v1/posts
          name: posts
          description: "WordPress posts"
          operations:
            - method: GET
              name: list-posts
              description: "List posts"
              call: "wordpress-rest.list-posts"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-post
              description: "Create post"
              call: "wordpress-rest.create-post"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/posts/{id}
          name: post-by-id
          operations:
            - method: GET
              name: get-post
              description: "Get post by ID"
              call: "wordpress-rest.get-post"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: PUT
              name: update-post
              description: "Update post"
              call: "wordpress-rest.update-post"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: DELETE
              name: delete-post
              description: "Delete post"
              call: "wordpress-rest.delete-post"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: wordpress-mcp
      transport: http
      tools:
        - name: list-posts
          description: "List WordPress posts with filtering and pagination"
          hints:
            readOnly: true
            openWorld: true
          call: "wordpress-rest.list-posts"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-post
          description: "Get a single WordPress post by ID"
          hints:
            readOnly: true
            openWorld: true
          call: "wordpress-rest.get-post"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-post
          description: "Create a new WordPress post"
          hints:
            readOnly: false
            openWorld: false
          call: "wordpress-rest.create-post"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-post
          description: "Update an existing WordPress post"
          hints:
            readOnly: false
            idempotent: true
          call: "wordpress-rest.update-post"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-post
          description: "Delete a WordPress post"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "wordpress-rest.delete-post"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-pages
          description: "List WordPress pages"
          hints:
            readOnly: true
            openWorld: true
          call: "wordpress-rest.list-pages"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-page
          description: "Create a new WordPress page"
          hints:
            readOnly: false
            openWorld: false
          call: "wordpress-rest.create-page"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-media
          description: "List WordPress media library items"
          hints:
            readOnly: true
            openWorld: true
          call: "wordpress-rest.list-media"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-comments
          description: "List WordPress comments"
          hints:
            readOnly: true
            openWorld: true
          call: "wordpress-rest.list-comments"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-comment
          description: "Create a new WordPress comment"
          hints:
            readOnly: false
            openWorld: false
          call: "wordpress-rest.create-comment"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-users
          description: "List WordPress users"
          hints:
            readOnly: true
            openWorld: true
          call: "wordpress-rest.list-users"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-categories
          description: "List WordPress categories"
          hints:
            readOnly: true
            openWorld: true
          call: "wordpress-rest.list-categories"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-category
          description: "Create a new WordPress category"
          hints:
            readOnly: false
            openWorld: false
          call: "wordpress-rest.create-category"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-tags
          description: "List WordPress tags"
          hints:
            readOnly: true
            openWorld: true
          call: "wordpress-rest.list-tags"
          outputParameters:
            - type: object
              mapping: "$."
        - name: search-content
          description: "Search across WordPress content"
          hints:
            readOnly: true
            openWorld: true
          call: "wordpress-rest.search-content"
          with:
            search: "tools.search"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-settings
          description: "Get WordPress site settings"
          hints:
            readOnly: true
            openWorld: false
          call: "wordpress-rest.get-settings"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-themes
          description: "List installed WordPress themes"
          hints:
            readOnly: true
            openWorld: false
          call: "wordpress-rest.list-themes"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-plugins
          description: "List installed WordPress plugins"
          hints:
            readOnly: true
            openWorld: false
          call: "wordpress-rest.list-plugins"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-block-types
          description: "List registered WordPress block types"
          hints:
            readOnly: true
            openWorld: true
          call: "wordpress-rest.list-block-types"
          outputParameters:
            - type: object
              mapping: "$."
