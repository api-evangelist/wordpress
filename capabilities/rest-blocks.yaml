naftiko: 1.0.0-alpha2
info:
  label: WordPress REST API — Blocks
  description: 'WordPress REST API — Blocks. 1 operations. Lead operation: WordPress List Reusable Blocks. Self-contained
    Naftiko capability covering one Wordpress business surface.'
  tags:
  - Wordpress
  - Blocks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORDPRESS_API_KEY: WORDPRESS_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-blocks
    baseUri: https://{site}/wp-json
    description: WordPress REST API — Blocks business capability. Self-contained, no shared references.
    resources:
    - name: wp-v2-blocks
      path: /wp/v2/blocks
      operations:
      - name: listblocks
        method: GET
        description: WordPress List Reusable Blocks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Current page of the collection.
        - name: per_page
          in: query
          type: integer
          description: Maximum number of items.
    authentication:
      type: apikey
      key: wordpress_logged_in
      value: '{{env.WORDPRESS_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: rest-blocks-rest
    port: 8080
    description: REST adapter for WordPress REST API — Blocks. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/wp/v2/blocks
      name: wp-v2-blocks
      description: REST surface for wp-v2-blocks.
      operations:
      - method: GET
        name: listblocks
        description: WordPress List Reusable Blocks
        call: rest-blocks.listblocks
        with:
          page: rest.page
          per_page: rest.per_page
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-blocks-mcp
    port: 9090
    transport: http
    description: MCP adapter for WordPress REST API — Blocks. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: wordpress-list-reusable-blocks
      description: WordPress List Reusable Blocks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-blocks.listblocks
      with:
        page: tools.page
        per_page: tools.per_page
      outputParameters:
      - type: object
        mapping: $.
