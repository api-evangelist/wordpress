# ---------------------------------------------------------------------------
# Interfaces
# ---------------------------------------------------------------------------

"""Base interface for all globally identifiable nodes."""
interface Node {
  id: ID!
}

"""Interface for objects with a URI."""
interface UniformResourceIdentifiable {
  id: ID!
  uri: String
  isContentNode: Boolean!
  isTermNode: Boolean!
}

"""Interface for all content type nodes."""
interface ContentNode {
  id: ID!
  databaseId: Int!
  contentType: ContentTypeToContentTypeConnectionEdge
  contentTypeName: String!
  date: String
  dateGmt: String
  desiredSlug: String
  editingLockedBy: ContentNodeToEditLockConnectionEdge
  enclosure: String
  enqueuedScripts(first: Int, last: Int, after: String, before: String): ContentNodeToEnqueuedScriptConnection
  enqueuedStylesheets(first: Int, last: Int, after: String, before: String): ContentNodeToEnqueuedStylesheetConnection
  guid: String
  isPreview: Boolean
  isRestricted: Boolean
  lastEditedBy: ContentNodeToEditLastConnectionEdge
  link: String
  modified: String
  modifiedGmt: String
  previewRevisionDatabaseId: Int
  previewRevisionId: ID
  slug: String
  status: String
  template: ContentTemplate
  uri: String
}

"""Interface for content with a title field."""
interface NodeWithTitle {
  title(format: PostObjectFieldFormatEnum): String
}

"""Interface for content with body content."""
interface NodeWithContent {
  content(format: PostObjectFieldFormatEnum): String
}

"""Interface for content with an excerpt."""
interface NodeWithExcerpt {
  excerpt(format: PostObjectFieldFormatEnum): String
}

"""Interface for content with an author."""
interface NodeWithAuthor {
  author: NodeWithAuthorToUserConnectionEdge
  authorDatabaseId: Int
  authorId: ID
}

"""Interface for content with a featured image."""
interface NodeWithFeaturedImage {
  featuredImage: NodeWithFeaturedImageToMediaItemConnectionEdge
  featuredImageDatabaseId: Int
  featuredImageId: ID
}

"""Interface for content that supports comments."""
interface NodeWithComments {
  commentCount: Int
  commentStatus: String
  comments(first: Int, last: Int, after: String, before: String, where: CommentConnectionWhereArgs): NodeWithCommentsToCommentConnection
}

"""Interface for content with a page template."""
interface NodeWithTemplate {
  template: ContentTemplate
}

"""Interface for hierarchical content (pages, categories)."""
interface HierarchicalNode {
  parentId: ID
  parentDatabaseId: Int
}

"""Interface for objects that can be previewed."""
interface Previewable {
  isPreview: Boolean
  previewRevisionDatabaseId: Int
  previewRevisionId: ID
  preview: PostToPreviewConnectionEdge
}

"""Interface for term nodes (taxonomy terms)."""
interface TermNode {
  id: ID!
  databaseId: Int!
  count: Int
  description: String
  enqueuedScripts(first: Int, last: Int, after: String, before: String): TermNodeToEnqueuedScriptConnection
  enqueuedStylesheets(first: Int, last: Int, after: String, before: String): TermNodeToEnqueuedStylesheetConnection
  isContentNode: Boolean!
  isRestricted: Boolean
  isTermNode: Boolean!
  link: String
  name: String
  slug: String
  taxonomyName: String
  termGroupId: Int
  termTaxonomyId: Int
  uri: String
}

"""Enum for post object field format (rendered vs raw)."""
enum PostObjectFieldFormatEnum {
  RAW
  RENDERED
}

"""Interface for content templates."""
interface ContentTemplate {
  templateName: String
}

# ---------------------------------------------------------------------------
# Types: Page Info (Relay spec)
# ---------------------------------------------------------------------------

"""Pagination metadata for a connection."""
type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

# ---------------------------------------------------------------------------
# Types: Post
# ---------------------------------------------------------------------------

"""A WordPress post."""
type Post implements Node & ContentNode & UniformResourceIdentifiable & NodeWithTitle & NodeWithContent & NodeWithExcerpt & NodeWithAuthor & NodeWithFeaturedImage & NodeWithComments & NodeWithTemplate & Previewable {
  id: ID!
  databaseId: Int!
  authorDatabaseId: Int
  authorId: ID
  author: NodeWithAuthorToUserConnectionEdge
  categories(first: Int, last: Int, after: String, before: String, where: TermConnectionWhereArgs): PostToCategoryConnection
  commentCount: Int
  commentStatus: String
  comments(first: Int, last: Int, after: String, before: String, where: CommentConnectionWhereArgs): NodeWithCommentsToCommentConnection
  content(format: PostObjectFieldFormatEnum): String
  contentType: ContentTypeToContentTypeConnectionEdge
  contentTypeName: String!
  date: String
  dateGmt: String
  desiredSlug: String
  editingLockedBy: ContentNodeToEditLockConnectionEdge
  enclosure: String
  excerpt(format: PostObjectFieldFormatEnum): String
  featuredImage: NodeWithFeaturedImageToMediaItemConnectionEdge
  featuredImageDatabaseId: Int
  featuredImageId: ID
  guid: String
  isPreview: Boolean
  isRestricted: Boolean
  isSticky: Boolean!
  isTermNode: Boolean!
  isContentNode: Boolean!
  lastEditedBy: ContentNodeToEditLastConnectionEdge
  link: String
  modified: String
  modifiedGmt: String
  pingStatus: String
  pinged: [String]
  postFormats(first: Int, last: Int, after: String, before: String, where: TermConnectionWhereArgs): PostToPostFormatConnection
  preview: PostToPreviewConnectionEdge
  previewRevisionDatabaseId: Int
  previewRevisionId: ID
  revisions(first: Int, last: Int, after: String, before: String, where: PostToRevisionConnectionWhereArgs): PostToRevisionConnection
  slug: String
  status: String
  tags(first: Int, last: Int, after: String, before: String, where: TermConnectionWhereArgs): PostToTagConnection
  template: ContentTemplate
  title(format: PostObjectFieldFormatEnum): String
  toPing: [String]
  uri: String
}

"""Connection to multiple Post objects."""
type PostConnection {
  edges: [PostEdge!]!
  nodes: [Post!]!
  pageInfo: PageInfo!
}

"""Edge in a Post connection."""
type PostEdge {
  cursor: String
  node: Post!
}

