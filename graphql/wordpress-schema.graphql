"""
WordPress GraphQL Schema (WPGraphQL)
Provider: WordPress / WPGraphQL Plugin
Source: https://www.wpgraphql.com/docs/
GitHub: https://github.com/wp-graphql/wp-graphql
Endpoint: POST https://{site}/graphql
"""

# ---------------------------------------------------------------------------
# Scalars
# ---------------------------------------------------------------------------

scalar ID
scalar String
scalar Boolean
scalar Int
scalar Float

"""ISO 8601 date-time string."""
scalar DateTime

"""URL string."""
scalar URL

"""HTML string (may contain markup)."""
scalar HTML

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

"""Allowed content type slugs registered on the site."""
enum ContentTypeEnum {
  POST
  PAGE
  ATTACHMENT
  REVISION
  NAV_MENU_ITEM
}

"""Taxonomy slug identifiers."""
enum TaxonomyEnum {
  CATEGORY
  TAG
  POST_FORMAT
  NAV_MENU
}

"""Post status values."""
enum PostStatus {
  PUBLISH
  FUTURE
  DRAFT
  PENDING
  PRIVATE
  TRASH
  AUTO_DRAFT
  INHERIT
}

"""Plugin activation status."""
enum PluginStatus {
  ACTIVE
  INACTIVE
  DROP_IN
  MUST_USE
  NETWORK_ACTIVATED
}

"""Theme status."""
enum ThemeStatus {
  ACTIVE
  INACTIVE
}

"""Comment status for a comment object."""
enum CommentStatus {
  APPROVE
  HOLD
  SPAM
  TRASH
}

"""Sort order direction."""
enum OrderEnum {
  ASC
  DESC
}

"""Logical relation for compound queries."""
enum RelationEnum {
  AND
  OR
}

"""MIME type groups for media filtering."""
enum MimeTypeEnum {
  IMAGE_JPEG
  IMAGE_PNG
  IMAGE_GIF
  IMAGE_WEBP
  IMAGE_SVG_XML
  VIDEO_MP4
  VIDEO_QUICKTIME
  AUDIO_MPEG
  AUDIO_OGG
  APPLICATION_PDF
  APPLICATION_ZIP
}

"""Registered nav menu locations."""
enum MenuLocationEnum {
  PRIMARY
  SECONDARY
  FOOTER
  SOCIAL
  MOBILE
}

"""Fields available for post ordering."""
enum PostObjectsConnectionOrderbyField {
  AUTHOR
  COMMENT_COUNT
  DATE
  MENU_ORDER
  MODIFIED
  NAME_IN
  PARENT
  SLUG
  TITLE
  IN
}

# ---------------------------------------------------------------------------
# Input Types
# ---------------------------------------------------------------------------

"""Ordering clause for post object connections."""
input PostObjectsConnectionOrderbyInput {
  field: PostObjectsConnectionOrderbyField!
  order: OrderEnum!
}

"""Date comparison query."""
input DateQueryInput {
  after: DateInput
  before: DateInput
  column: String
  compare: String
  day: Int
  hour: Int
  inclusive: Boolean
  minute: Int
  month: Int
  relation: RelationEnum
  second: Int
  week: Int
  year: Int
}

"""Specific date parts for after/before clauses."""
input DateInput {
  day: Int
  month: Int
  year: Int
}

"""Where arguments for filtering post connections."""
input PostConnectionWhereArgs {
  author: Int
  authorIn: [ID]
  authorNotIn: [ID]
  authorName: String
  categoryId: Int
  categoryIn: [ID]
  categoryName: String
  dateQuery: DateQueryInput
  hasPassword: Boolean
  id: Int
  in: [ID]
  mimeType: MimeTypeEnum
  name: String
  nameIn: [String]
  notIn: [ID]
  orderby: [PostObjectsConnectionOrderbyInput]
  parent: ID
  parentIn: [ID]
  parentNotIn: [ID]
  password: String
  search: String
  stati: [PostStatus]
  status: PostStatus
  tag: String
  tagId: String
  tagIn: [ID]
  tagNotIn: [ID]
  tagSlugAnd: [String]
  tagSlugIn: [String]
  title: String
}

"""Where arguments for filtering page connections."""
input PageConnectionWhereArgs {
  author: Int
  authorIn: [ID]
  authorName: String
  dateQuery: DateQueryInput
  hasPassword: Boolean
  id: Int
  in: [ID]
  menuOrder: Int
  name: String
  nameIn: [String]
  notIn: [ID]
  orderby: [PostObjectsConnectionOrderbyInput]
  parent: ID
  parentIn: [ID]
  parentNotIn: [ID]
  password: String
  search: String
  stati: [PostStatus]
  status: PostStatus
  title: String
}

"""Where arguments for user connections."""
input UserConnectionWhereArgs {
  exclude: [Int]
  hasPublishedPosts: [ContentTypeEnum]
  include: [Int]
  login: String
  loginIn: [String]
  loginNotIn: [String]
  nicename: String
  nicenameIn: [String]
  nicenameNotIn: [String]
  orderby: [UsersConnectionOrderbyInput]
  role: UserRoleEnum
  roleIn: [UserRoleEnum]
  roleNotIn: [UserRoleEnum]
