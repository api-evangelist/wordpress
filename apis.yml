- type: Features
  data:
  - name: REST API
    description: JSON-based REST API for interacting with WordPress content including
      posts, pages, media, users, and custom post types
  - name: Block Editor
    description: Gutenberg block editor with JavaScript and PHP APIs for creating
      custom blocks and extending the editing experience
  - name: Application Passwords
    description: Built-in authentication mechanism for third-party applications using
      per-application passwords with granular scoping
  - name: WP-CLI
    description: Command-line interface for managing WordPress installations, automating
      tasks, and running deployments
  - name: Plugin API
    description: Hooks and filters system for extending WordPress functionality through
      plugins without modifying core code
  - name: Multisite
    description: WordPress Multisite enables running a network of sites from a single
      WordPress installation with shared users and plugins
  - name: WordPress Playground
    description: Run WordPress in the browser via WebAssembly PHP for development,
      testing, and demonstrations
  - name: AI Integration
    description: Provider-agnostic PHP AI client SDK and MCP adapter for integrating
      generative AI capabilities into WordPress
- type: UseCases
  data:
  - name: Headless CMS
    description: Use WordPress as a headless CMS with the REST API to deliver content
      to any frontend framework like Next.js, Nuxt, or React
  - name: Mobile Applications
    description: Build iOS and Android apps that read and write WordPress content
      using the REST API
  - name: Content Automation
    description: Automate content creation, publishing, and management using WP-CLI
      in CI/CD pipelines
  - name: Custom Block Development
    description: Create custom Gutenberg blocks for unique editorial experiences and
      complex page layouts
  - name: Third-Party Integrations
    description: Connect WordPress to external services like CRMs, analytics platforms,
      and e-commerce systems via the REST API
  - name: AI-Powered Content
    description: Enhance WordPress with AI content generation, writing assistance,
      and intelligent recommendations
- type: Integrations
  data:
  - name: WooCommerce
    description: E-commerce plugin with its own REST API that extends WordPress for
      online stores
  - name: Jetpack
    description: WordPress.com connectivity plugin providing security, performance,
      and marketing tools
  - name: Advanced Custom Fields
    description: Custom field framework for extending WordPress content models with
      structured data
  - name: Elementor
    description: Visual page builder with REST API extensions for custom integrations
  - name: OpenAI
    description: AI provider integration via WordPress AI API for content generation
      and assistance
  - name: Anthropic
    description: AI provider integration via WordPress AI API using Claude models
  - name: Google AI
    description: AI provider integration via WordPress AI API for Gemini models
- name: MCP Server
  url: https://github.com/WordPress/mcp-adapter
  type: MCPServer
- name: Agent Skills
  url: https://github.com/WordPress/agent-skills
  type: AgentSkills
