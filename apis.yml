apis:
- aid: wordpress:wp-cli
  name: WP-CLI
  description: >-
    WP-CLI is the command-line interface for WordPress. It provides commands for managing WordPress installations,
    plugins, themes, users, content, and more without using a web browser. WP-CLI is widely used for automation,
    deployment, and development workflows.
  humanURL: https://wp-cli.org/
  tags:
  - CLI
  - Command Line
  - DevOps
  - WordPress
  properties:
  - type: Documentation
    url: https://wp-cli.org/
  - type: APIReference
    url: https://developer.wordpress.org/cli/commands/
  - type: GitHubRepository
    url: https://github.com/wp-cli/wp-cli
  - type: CLI
    url: https://wp-cli.org/
- aid: wordpress:block-editor-api
  name: WordPress Block Editor API
  description: >-
    The Block Editor API (Gutenberg) enables developers to create custom blocks, block patterns, block
    templates, and editor plugins for the WordPress Block Editor. It includes JavaScript and PHP APIs
    for registering block types, modifying editor behavior, and extending the editing experience.
  humanURL: https://developer.wordpress.org/block-editor/
  tags:
  - Block Editor
  - Gutenberg
  - JavaScript
  - WordPress
  properties:
  - type: Documentation
    url: https://developer.wordpress.org/block-editor/
  - type: APIReference
    url: https://developer.wordpress.org/block-editor/reference-guides/
  - type: GitHubRepository
    url: https://github.com/WordPress/gutenberg
  - type: GettingStarted
    url: https://developer.wordpress.org/block-editor/getting-started/
- aid: wordpress:ai-api
  name: WordPress AI API
  description: >-
    WordPress AI API provides a provider-agnostic interface for integrating generative AI capabilities
    into WordPress plugins and themes. It supports multiple AI providers (OpenAI, Google, Anthropic) through
    a unified PHP client interface and includes an MCP adapter for bridging to the Model Context Protocol.
  humanURL: https://github.com/WordPress/wp-ai-client
  tags:
  - Artificial Intelligence
  - Generative AI
  - MCP
  - WordPress
  tags_raw:
