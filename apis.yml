name: WordPress
description: WordPress is an open-source content management system (CMS) that powers
  a significant portion of websites on the internet. Its REST API enables applications
  to interact with WordPress sites by sending and receiving data as JSON, allowing
  developers to build decoupled frontends, mobile apps, and integrations in any language.
  The extensive plugin and theme ecosystem, block editor, and AI capabilities make
  it accessible for building everything from personal blogs to complex enterprise
  websites.
